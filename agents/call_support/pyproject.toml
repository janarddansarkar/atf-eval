[project]
name = "call-support-agent"
version = "0.1.0"
description = "A telecom call-support agent built with LangGraph and LangChain, with built-in tracing"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
call-support-chat = "call_support.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
